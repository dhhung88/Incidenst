<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2c3e50">
  <title>Báo Sự Cố </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsqUZo_6BryZ5nJzxXB4xdSM4shloO9Ps",
      authDomain: "abico-63099.firebaseapp.com",
      projectId: "abico-63099",
      storageBucket: "abico-63099.firebasestorage.app",
      messagingSenderId: "764504395267",
      appId: "1:764504395267:web:2b6090aca2a8d2bdf48836"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
    const db = getFirestore(app);
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTt6B5_cTTEM4cbNUtKuN7079B0Db7984EuP2c34wD7y7o1ZYOVfaqyHmyRwHA1pI/exec";

    const category2Options = {
      "Network": ["Wi-Fi", "LAN", "Internet(ISP)", "Router", "Switch", "Access Point"],
      "POS": ["POS Printer", "Scanner", "OES", "POS Network", "ALL POS Error", "POS 01 Cash Error", "POS 02 Cash Error"],
      "Printer": ["KP1", "KP2", "KP3", "KP4", "KP5", "Do not print bill", "Blurry Bill", "All KP"],
      "Server": ["Server Down", "Database", "Backup", "Storage", "Access", "Security"],
      "CCTV": ["Camera", "NVR", "Recording", "Playback", "Camera Offline", "HDD"],
      "Hardware": ["PC", "Monitor", "Keyboard", "Mouse", "Printer", "Scanner", "Tell Phone"],
      "Software": ["Application", "Windows", "Update", "License", "System Error"],
      "Handy": ["Won't power on", "Not charging", "Doesn't connect to Wi-Fi"],
      "Attendance": ["Network Error", "Data not loading", "Won't power on"],
      "KD": ["All KD Error", "KD1", "KD2", "HOT", "OES", "KD Network", "TO & DL", "Do not show the bill"],
      "Khác": ["Khác"]
    };

    let systemKnowledgeBase = [];
    let allStores = [];

    async function initPage() {
      // 1. Tải danh sách cửa hàng trực tiếp từ Firestore collection 'stores'
      try {
        const sSnap = await getDocs(collection(db, "stores"));
        if (!sSnap.empty) {
          allStores = [];
          sSnap.forEach(docSnap => {
            const data = docSnap.data();
            allStores.push({
              code: data.code || docSnap.id,
              name: data.name || docSnap.id,
              address: data.address || "Chưa cập nhật"
            });
          });
          // Sắp xếp danh sách cửa hàng theo mã code tăng dần
          allStores.sort((a, b) => a.code.localeCompare(b.code, undefined, {numeric: true}));
        }
      } catch(e) {
        console.log("Lỗi tải cửa hàng từ Firebase:", e.message);
      }

      const storeSelect = document.getElementById('incStoreCode');
      if (allStores.length > 0) {
        storeSelect.innerHTML = `<option value="">-- Chọn Cửa Hàng của bạn (${allStores.length} chi nhánh) --</option>` + 
          allStores.map(s => `<option value="${s.code}">${s.code} - ${s.name}</option>`).join('');
      } else {
        storeSelect.innerHTML = `<option value="">Không tải được danh sách cửa hàng từ Firebase</option>`;
      }

      document.getElementById('incTicket').value = 'SC-' + Math.floor(100000 + Math.random() * 900000);
      
      const d = new Date();
      document.getElementById('incTime').value = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

      // 2. Tải Kho tri thức (Knowledge Base)
      try {
        const qSnap = await getDocs(collection(db, "knowledge_base"));
        qSnap.forEach(doc => systemKnowledgeBase.push({ id: doc.id, ...doc.data() }));
      } catch(e) { console.log("Không tải được KB:", e.message); }
    }

    window.onStoreChange = function() {
      const code = document.getElementById('incStoreCode').value;
      const store = allStores.find(s => s.code === code);
      if(store) document.getElementById('incAddress').value = store.address || '';
    };

    window.onCategoryChange = function() {
      const checkedCats = [];
      document.querySelectorAll('input[name="incCategory"]:checked').forEach(cb => checkedCats.push(cb.value));
      const cat2Select = document.getElementById('incCategory2');
      cat2Select.innerHTML = `<option value="">-- Chọn Chi tiết lỗi (Category 2) --</option>`;
      
      let subList = [];
      checkedCats.forEach(cat => {
          if (category2Options[cat]) subList = subList.concat(category2Options[cat]);
      });
      
      [...new Set(subList)].forEach(item => {
          const opt = document.createElement('option');
          opt.value = item;
          opt.innerText = item;
          cat2Select.appendChild(opt);
      });
      document.getElementById('inlineKbSuggestion').classList.add('hidden');
    };

    window.onCategory2Change = function() {
      const selectedCategory2 = document.getElementById('incCategory2').value;
      const suggestionBox = document.getElementById('inlineKbSuggestion');
      const suggestionContent = document.getElementById('inlineKbContent');
      if (!selectedCategory2) { suggestionBox.classList.add('hidden'); return; }

      const matchedKBs = systemKnowledgeBase.filter(kb => 
          kb.category2 === selectedCategory2 || (kb.title && kb.title.toLowerCase().includes(selectedCategory2.toLowerCase()))
      );

      if (matchedKBs.length > 0) {
          suggestionContent.innerHTML = matchedKBs.map(kb => {
              const stepsHtml = Array.isArray(kb.steps) ? kb.steps.map(s => `<li>${s}</li>`).join('') : `<li>${kb.steps}</li>`;
              return `<div class="mb-2 last:mb-0"><div class="font-bold text-blue-900">💡 Gợi ý xử lý: ${kb.title}</div><ul class="list-disc pl-4 text-gray-700 mt-0.5 space-y-0.5">${stepsHtml}</ul></div>`;
          }).join('');
          suggestionBox.classList.remove('hidden');
      } else { suggestionBox.classList.add('hidden'); }
    };

    async function compressImageFile(file, maxWidth = 600, quality = 0.7) {
      return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
              const img = new Image();
              img.src = event.target.result;
              img.onload = () => {
                  const canvas = document.createElement('canvas');
                  let width = img.width, height = img.height;
                  if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                  canvas.width = width; canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, width, height);
                  resolve(canvas.toDataURL('image/jpeg', quality));
              };
              img.onerror = reject;
          };
          reader.onerror = reject;
      });
    }

    window.previewImage = async function(event) {
      const file = event.target.files[0];
      const container = document.getElementById('imagePreviewContainer');
      const img = document.getElementById('imagePreview');
      if (file) {
          try {
              const compressedBase64 = await compressImageFile(file, 600, 0.7);
              img.src = compressedBase64;
              container.classList.remove('hidden');
          } catch (e) { alert("Lỗi đọc ảnh"); }
      }
    };

    window.submitIncident = async function() {
      const incId = document.getElementById('incTicket').value;
      const storeCode = document.getElementById('incStoreCode').value;
      const contactPerson = document.getElementById('incContact').value.trim();
      const phoneNumber = document.getElementById('incPhone').value.trim();
      const issue = document.getElementById('incIssue').value.trim();
      const category2 = document.getElementById('incCategory2').value;
      const errorBox = document.getElementById('formErrorMsg');

      errorBox.classList.add('hidden');
      if (!storeCode || !contactPerson || !phoneNumber || !issue || !category2) {
          errorBox.innerText = "Vui lòng chọn Cửa hàng, điền đầy đủ thông tin và Chi tiết lỗi (*)!";
          errorBox.classList.remove('hidden'); window.scrollTo({top: 0, behavior: 'smooth'}); return;
      }

      const categories = [];
      document.querySelectorAll('input[name="incCategory"]:checked').forEach(cb => categories.push(cb.value));
      if (categories.length === 0) {
          errorBox.innerText = "Vui lòng chọn ít nhất một Phân loại lỗi chính!";
          errorBox.classList.remove('hidden'); return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; btn.innerText = "Đang gửi báo cáo...";

      try {
        let imageUrl = document.getElementById('imagePreview').src || "";
        if(!imageUrl.startsWith('data:image')) imageUrl = "";

        const nowIso = new Date().toISOString();
        const incData = {
          id: incId, storeCode, contactPerson, phoneNumber, categories, category2, issue, imageUrl,
          status: "Mới ghi nhận", assignee: "Chưa gán", tempSolution: "", result: "", resolvedAt: null,
          createdAt: nowIso, updatedAt: nowIso, reportedBy: contactPerson,
          auditLog: [{ time: nowIso, user: contactPerson, action: "Nhân viên tạo phiếu báo sự cố từ QR" }]
        };

        await setDoc(doc(db, "incidents", incId), incData);

        const message = `🚨 <b>SỰ CỐ MỚI TỪ CỬA HÀNG (QR)</b> 🚨\n<b>Mã phiếu:</b> ${incId}\n<b>Cửa hàng:</b> ${storeCode}\n<b>Người báo:</b> ${contactPerson} (${phoneNumber})\n<b>Phân loại:</b> ${categories.join(', ')} (${category2})\n<b>Mô tả:</b> <i>${issue}</i>`;
        fetch(GOOGLE_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "sendTelegram", message }) }).catch(()=>{});

        document.getElementById('successScreen').classList.remove('hidden');
        document.getElementById('mainFormContainer').classList.add('hidden');
      } catch(e) {
          errorBox.innerText = "Lỗi gửi phiếu (Kiểm tra quyền ghi Firebase Rules): " + e.message;
          errorBox.classList.remove('hidden');
          btn.disabled = false; btn.innerText = "Gửi Yêu Cầu Hỗ Trợ";
      }
    };

    window.onload = initPage;
  </script>
</head>
<body class="bg-slate-100 text-gray-800 font-sans p-3 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-xl p-4 sm:p-6 w-full max-w-lg border border-gray-200 my-auto">
    <div class="text-center pb-4 mb-4 border-b">
      <div class="text-2xl font-black text-amber-600 mb-1">⚠️ Sukiya POS</div>
      <h1 class="text-lg font-bold text-slate-800">Báo Cáo Sự Cố Kỹ Thuật</h1>
      <p class="text-xs text-gray-500">Dành cho nhân viên cửa hàng quét QR tại quầy</p>
    </div>

    <div id="successScreen" class="hidden text-center py-10 space-y-4">
      <div class="text-5xl">✅</div>
      <h2 class="text-xl font-bold text-green-700">Gửi Báo Cáo Thành Công!</h2>
      <p class="text-xs text-gray-600">Bộ phận IT đã nhận được thông tin và sẽ hỗ trợ cửa hàng trong thời gian sớm nhất.</p>
      <button onclick="location.reload()" class="px-6 py-2.5 bg-slate-800 text-white font-bold rounded-lg text-xs">Báo cáo sự cố khác</button>
    </div>

    <div id="mainFormContainer" class="space-y-4 text-xs">
      <div id="formErrorMsg" class="hidden bg-red-100 text-red-700 font-bold p-2.5 rounded-lg text-center"></div>

      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-gray-500 font-semibold">Mã Phiếu</label><input id="incTicket" type="text" class="w-full p-2 bg-gray-50 font-bold border rounded-lg" readonly></div>
        <div><label class="text-gray-500 font-semibold">Thời gian</label><input id="incTime" type="text" class="w-full p-2 bg-gray-50 border rounded-lg" readonly></div>
      </div>

      <div>
        <label class="font-bold text-gray-700 block mb-1">* Chọn Cửa Hàng của bạn</label>
        <select id="incStoreCode" onchange="onStoreChange()" class="w-full p-2.5 border rounded-lg font-semibold bg-white text-sm" required></select>
        <input type="hidden" id="incAddress">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label class="font-bold text-gray-700 block mb-1">* Tên nhân viên báo</label><input id="incContact" type="text" placeholder="Nhập tên của bạn..." class="w-full p-2.5 border rounded-lg" required></div>
        <div><label class="font-bold text-gray-700 block mb-1">* Số điện thoại liên hệ</label><input id="incPhone" type="tel" placeholder="Số điện thoại..." class="w-full p-2.5 border rounded-lg" required></div>
      </div>

      <div class="border-t pt-3">
        <label class="font-bold text-gray-700 block mb-2">* Phân loại lỗi chính (chọn ít nhất 1)</label>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="Network" onchange="onCategoryChange()"> Network / Mạng</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="POS" onchange="onCategoryChange()"> POS / Máy tính tiền</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="Printer" onchange="onCategoryChange()"> Printer / Máy in bếp</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="Server" onchange="onCategoryChange()"> Server / Máy chủ</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="CCTV" onchange="onCategoryChange()"> CCTV / Camera</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="Handy" onchange="onCategoryChange()"> Handy / Thiết bị cầm tay</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="Attendance" onchange="onCategoryChange()"> Máy chấm công</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" name="incCategory" value="Khác" onchange="onCategoryChange()"> Khác</label>
        </div>

        <div>
          <label class="font-bold text-gray-700 block mb-1">* Chi tiết lỗi (Category 2)</label>
          <select id="incCategory2" onchange="onCategory2Change()" class="w-full p-2.5 border rounded-lg font-semibold text-blue-900 bg-white" required>
            <option value="">-- Vui lòng chọn phân loại phía trên trước --</option>
          </select>
        </div>

        <div id="inlineKbSuggestion" class="hidden mt-3 bg-blue-50 border border-blue-200 rounded-lg p-3">
          <div id="inlineKbContent"></div>
        </div>
      </div>

      <div>
        <label class="font-bold text-gray-700 block mb-1">* Mô tả chi tiết sự cố</label>
        <textarea id="incIssue" rows="3" placeholder="Mô tả ngắn gọn thiết bị gặp lỗi, màn hình báo gì..." class="w-full p-2.5 border rounded-lg" required></textarea>
      </div>

      <div>
        <label class="font-bold text-gray-700 block mb-1">📸 Chụp ảnh hiện trường (Bắt buộc nếu lỗi thiết bị)</label>
        <input type="file" id="incImage" accept="image/*" capture="environment" onchange="previewImage(event)" class="w-full p-2 border rounded-lg bg-slate-50">
        <div id="imagePreviewContainer" class="hidden mt-2 text-center"><img id="imagePreview" class="h-32 object-contain mx-auto rounded border shadow-sm"></div>
      </div>

      <button id="btnSubmit" type="button" onclick="submitIncident()" class="w-full bg-[#2c3e50] hover:bg-[#1a252f] text-white font-bold py-3 rounded-xl shadow-lg text-sm mt-4">Gửi Yêu Cầu Hỗ Trợ</button>
    </div>
  </div>

</body>
</html>
